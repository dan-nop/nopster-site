<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap');
      .wordmark { font-family: 'IBM Plex Sans', Helvetica, Arial, sans-serif; font-weight: 700; }
      .subtext { font-family: 'IBM Plex Mono', 'Courier New', monospace; font-weight: 500; }
    </style>
  </defs>

  <!-- Mark, scaled/positioned at left -->
  <g transform="translate(20, 20) scale(0.67)">
    <line x1="60" y1="180" x2="60" y2="60" stroke="#2C6E68" stroke-width="7" stroke-linecap="round"/>
    <line x1="60" y1="60" x2="180" y2="180" stroke="#2C6E68" stroke-width="7" stroke-linecap="round"/>
    <line x1="180" y1="180" x2="180" y2="60" stroke="#2C6E68" stroke-width="7" stroke-linecap="round"/>
    <circle cx="60" cy="180" r="16" fill="#FFFFFF" stroke="#2C6E68" stroke-width="4"/>
    <circle cx="180" cy="180" r="16" fill="#FFFFFF" stroke="#2C6E68" stroke-width="4"/>
    <circle cx="180" cy="60" r="16" fill="#FFFFFF" stroke="#2C6E68" stroke-width="4"/>
    <circle cx="60" cy="60" r="20" fill="#14192B"/>
  </g>

  <!-- Wordmark -->
  <text x="200" y="108" class="wordmark" font-size="52" fill="#14192B">NOPSTER<tspan fill="#2C6E68">.</tspan></text>
  <text x="200" y="140" class="subtext" font-size="20" letter-spacing="3" fill="#5B6472">INCORPORATED</text>
</svg>
